<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Use-By Hub — Son Kullanma Tarihi Takibi</title>
    <meta name="description" content="Ürünlerinizin son kullanma tarihlerini kolayca takip edin. Barkod tarayıcı, renk kodlu uyarılar ve akıllı bildirimler.">
    <meta name="theme-color" content="#4338ca">

    <!-- Google Fonts — Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS v3 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <!-- html5-qrcode -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-gradient-to-br from-slate-50 via-indigo-50/30 to-purple-50/20 min-h-screen font-sans antialiased">

    <!-- ===================== HEADER ===================== -->
    <header class="header-glass fixed top-0 left-0 right-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 sm:h-18">
                <!-- Logo -->
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center backdrop-blur-sm border border-white/10">
                        <span class="text-xl">📦</span>
                    </div>
                    <div>
                        <h1 class="text-lg sm:text-xl font-extrabold text-white tracking-tight">Use-By Hub</h1>
                        <p class="text-[10px] sm:text-xs text-indigo-200/80 font-medium -mt-0.5">Son Kullanma Tarihi Takibi</p>
                    </div>
                </div>

                <!-- Header Actions -->
                <div class="flex items-center gap-2 sm:gap-3">
                    <!-- Desktop Add Button -->
                    <button id="header-add-btn" class="hidden sm:inline-flex items-center gap-2 bg-white/15 hover:bg-white/25 text-white px-4 py-2 rounded-xl transition-all duration-200 backdrop-blur-sm font-semibold text-sm border border-white/10 hover:border-white/20 hover:shadow-lg hover:shadow-indigo-500/10 active:scale-95">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Ürün Ekle
                    </button>

                    <!-- Notification Bell -->
                    <button id="notification-bell" class="relative p-2.5 bg-white/10 hover:bg-white/20 rounded-xl transition-all duration-200 border border-white/10 group" title="Bildirimler">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white group-hover:text-yellow-200 transition-colors">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <span id="notification-badge" class="hidden absolute -top-1.5 -right-1.5 bg-red-500 text-white text-[10px] font-bold rounded-full min-w-[20px] h-5 flex items-center justify-center px-1 shadow-lg shadow-red-500/30 ring-2 ring-indigo-900">0</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- ===================== MAIN CONTENT ===================== -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-24 sm:pt-28 pb-28">

        <!-- Stats Summary Bar -->
        <div id="stats-bar" class="hidden mb-6 grid grid-cols-3 gap-3 sm:gap-4">
            <div class="stats-card bg-white/80 backdrop-blur-sm rounded-xl p-3 sm:p-4 border border-slate-200/60 shadow-sm">
                <p class="text-[10px] sm:text-xs font-semibold text-slate-400 uppercase tracking-wider">Toplam</p>
                <p id="stat-total" class="text-xl sm:text-2xl font-extrabold text-slate-800 mt-0.5">0</p>
            </div>
            <div class="stats-card bg-white/80 backdrop-blur-sm rounded-xl p-3 sm:p-4 border border-amber-200/60 shadow-sm">
                <p class="text-[10px] sm:text-xs font-semibold text-amber-500 uppercase tracking-wider">Dikkat</p>
                <p id="stat-warning" class="text-xl sm:text-2xl font-extrabold text-amber-600 mt-0.5">0</p>
            </div>
            <div class="stats-card bg-white/80 backdrop-blur-sm rounded-xl p-3 sm:p-4 border border-red-200/60 shadow-sm">
                <p class="text-[10px] sm:text-xs font-semibold text-red-500 uppercase tracking-wider">Geçmiş</p>
                <p id="stat-expired" class="text-xl sm:text-2xl font-extrabold text-red-600 mt-0.5">0</p>
            </div>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="flex flex-col items-center justify-center py-16 sm:py-24">
            <div class="relative mb-6">
                <div class="w-28 h-28 sm:w-32 sm:h-32 bg-gradient-to-br from-indigo-100 to-purple-100 rounded-3xl flex items-center justify-center shadow-inner">
                    <span class="text-5xl sm:text-6xl">📋</span>
                </div>
                <div class="absolute -bottom-2 -right-2 w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-500 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </div>
            </div>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-800 mb-2 text-center">Henüz ürün eklenmedi</h2>
            <p class="text-slate-500 text-sm sm:text-base mb-8 text-center max-w-md leading-relaxed">
                Son kullanma tarihlerini takip etmek için ilk ürününüzü ekleyin. Barkod tarayıcı ile hızlıca ekleyebilirsiniz.
            </p>
            <button id="empty-add-btn" class="inline-flex items-center gap-2 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white px-6 py-3.5 rounded-xl font-semibold text-sm transition-all duration-200 hover:shadow-xl hover:shadow-indigo-500/25 active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                İlk Ürünü Ekle
            </button>
        </div>

        <!-- Product Grid -->
        <div id="product-grid" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-5">
            <!-- Cards injected by JS -->
        </div>
    </main>

    <!-- ===================== FAB (Floating Action Button) ===================== -->
    <button id="fab-add" class="fab-button fixed bottom-6 right-6 sm:bottom-8 sm:right-8 w-14 h-14 sm:w-16 sm:h-16 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white rounded-2xl shadow-xl shadow-indigo-500/30 hover:shadow-2xl hover:shadow-indigo-500/40 transition-all duration-300 hover:scale-105 active:scale-95 flex items-center justify-center z-40" title="Ürün Ekle">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
    </button>

    <!-- ===================== MODAL ===================== -->
    <div id="modal-overlay" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40 backdrop-blur-sm transition-opacity duration-300">
        <div class="modal-content bg-white rounded-t-3xl sm:rounded-2xl shadow-2xl w-full sm:max-w-lg max-h-[92vh] sm:max-h-[85vh] overflow-hidden flex flex-col sm:mx-4">

            <!-- Modal Header -->
            <div class="flex items-center justify-between px-6 py-5 border-b border-slate-100">
                <div>
                    <h2 class="text-xl font-extrabold text-slate-800">Ürün Ekle</h2>
                    <p class="text-xs text-slate-400 mt-0.5">Manuel giriş veya barkod ile ekleyin</p>
                </div>
                <button id="modal-close" class="p-2 hover:bg-slate-100 rounded-xl transition-colors duration-200 text-slate-400 hover:text-slate-600" title="Kapat">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <!-- Tabs -->
            <div class="flex border-b border-slate-100 px-6">
                <button id="tab-manual" class="tab-btn tab-active flex-1 py-3 text-sm font-semibold transition-all duration-200 flex items-center justify-center gap-1.5">
                    <span>✏️</span> Manuel Giriş
                </button>
                <button id="tab-barcode" class="tab-btn flex-1 py-3 text-sm font-semibold transition-all duration-200 flex items-center justify-center gap-1.5">
                    <span>📷</span> Barkod Tarat
                </button>
            </div>

            <!-- Scrollable Content Area -->
            <div class="overflow-y-auto flex-1">

                <!-- Manual Entry Content -->
                <div id="manual-content" class="p-6">
                    <form id="product-form" class="space-y-5" novalidate>
                        <!-- Product Name -->
                        <div>
                            <label for="product-name" class="block text-sm font-semibold text-slate-700 mb-1.5">Ürün Adı</label>
                            <input
                                type="text"
                                id="product-name"
                                placeholder="Örn: Süt, Aspirin, Güneş Kremi..."
                                class="w-full px-4 py-3 bg-slate-50/80 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-400 transition-all duration-200 outline-none text-slate-800 placeholder:text-slate-400 text-sm"
                                autocomplete="off"
                                required
                            >
                        </div>

                        <!-- Category -->
                        <div>
                            <label for="product-category" class="block text-sm font-semibold text-slate-700 mb-1.5">Kategori</label>
                            <div class="relative">
                                <select
                                    id="product-category"
                                    class="w-full px-4 py-3 bg-slate-50/80 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-400 transition-all duration-200 outline-none appearance-none text-slate-800 text-sm cursor-pointer"
                                >
                                    <option value="Gıda">🍎 Gıda</option>
                                    <option value="İlaç">💊 İlaç</option>
                                    <option value="Kozmetik">💄 Kozmetik</option>
                                    <option value="Diğer">📦 Diğer</option>
                                </select>
                                <div class="absolute inset-y-0 right-3 flex items-center pointer-events-none text-slate-400">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="6 9 12 15 18 9"></polyline>
                                    </svg>
                                </div>
                            </div>
                        </div>

                        <!-- Expiry Date -->
                        <div>
                            <label for="product-expiry" class="block text-sm font-semibold text-slate-700 mb-1.5">Son Kullanma Tarihi</label>
                            <input
                                type="date"
                                id="product-expiry"
                                class="w-full px-4 py-3 bg-slate-50/80 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-400 transition-all duration-200 outline-none text-slate-800 text-sm cursor-pointer"
                                required
                            >
                        </div>

                        <!-- Submit Button -->
                        <button
                            type="submit"
                            id="submit-btn"
                            class="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white rounded-xl font-bold text-sm transition-all duration-200 hover:shadow-lg hover:shadow-indigo-500/25 active:scale-[0.98] flex items-center justify-center gap-2"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                            Ürünü Kaydet
                        </button>
                    </form>
                </div>

                <!-- Barcode Scanner Content -->
                <div id="barcode-content" class="hidden p-6">
                    <div class="bg-slate-900 rounded-2xl overflow-hidden mb-4 relative">
                        <div id="barcode-scanner" class="w-full min-h-[280px]"></div>
                        <!-- Scanner overlay corners -->
                        <div class="scanner-overlay absolute inset-0 pointer-events-none"></div>
                    </div>
                    <p id="barcode-result" class="text-sm text-slate-600 text-center min-h-[20px] font-medium"></p>
                    <p class="text-xs text-slate-400 text-center mt-2 flex items-center justify-center gap-1.5">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                            <circle cx="12" cy="13" r="4"></circle>
                        </svg>
                        Kameranızı barkodun üzerine tutun
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- ===================== TOAST CONTAINER ===================== -->
    <div id="toast-container" class="fixed top-20 sm:top-24 right-4 z-[60] flex flex-col gap-2.5 pointer-events-none w-[calc(100%-2rem)] sm:w-auto sm:max-w-sm"></div>

    <!-- ===================== APP JS ===================== -->
    <script src="js/app.js"></script>
</body>
</html>
